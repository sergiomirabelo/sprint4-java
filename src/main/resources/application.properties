spring.application.name=motiva

# Credenciais NUNCA no codigo: vem de variaveis de ambiente (as mesmas da Sprint 3)
spring.datasource.url=${MOTIVA_DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${MOTIVA_DB_USER}
spring.datasource.password=${MOTIVA_DB_PASSWORD}

# As tabelas ja existem (Sprint 3): o Hibernate nao deve criar/alterar nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true